name: Patch console and MQTT
on:
  push:
    branches: [clean-power-budget]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: clean-power-budget
          fetch-depth: 0
      - name: Patch files
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def one(text, pattern, replacement, name):
              out, n = re.subn(pattern, replacement, text, count=1, flags=re.S)
              if n != 1:
                  raise SystemExit(f"{name}: matches={n}")
              return out

          p = Path('lib/CentralConsole/CentralConsole.cpp')
          s = p.read_text()
          s = one(s, r'void batteryUsage\(\)\n\{.*?\n\}\n\nvoid sensorUsage', '''void batteryUsage()\n{\n    std::printf(\n        "Usage:\\n"\n        "  battery\\n"\n        "  battery status\\n"\n        "  battery configure shunt_ohms=R max_sensor_amps=A ema_alpha=X capacity_ah=AH initial_soc=PERCENT nominal_voltage=V\\n"\n        "  battery planning budget=W reserve=W min_soc=PERCENT [runtime_hours=H]\\n\\n"\n        "P_budget is the configured installation power allocation.\\n"\n        "P_reserve is power intentionally kept unused.\\n"\n        "INA219 and simulation provide voltage/current for P_measured.\\n");\n}\n\nvoid sensorUsage''', 'batteryUsage')
          s = one(s, r'    if \(argc >= 2 && same\(argv\[1\], "limits"\)\) \{.*?\n    \}\n\n    if \(argc < 2 \|\| !same\(argv\[1\], "configure"\)', '''    if (argc >= 2 && same(argv[1], "planning")) {\n        if (active_->callbacks_.configurePowerPlanning == nullptr) {\n            std::printf("[FAIL] power planning configuration is unavailable\\n");\n            return 1;\n        }\n\n        PowerPlanningCommandRequest request{};\n        if (!parseFloat(option(argc, argv, "budget"), request.P_budget) ||\n            !parseFloat(option(argc, argv, "reserve"), request.P_reserve) ||\n            !parseFloat(option(argc, argv, "min_soc"), request.minimumStateOfChargePercent)) {\n            batteryUsage();\n            return 1;\n        }\n        const char* runtimeText = option(argc, argv, "runtime_hours");\n        request.requiredRuntimeHours = 0.0F;\n        if (runtimeText != nullptr && !parseFloat(runtimeText, request.requiredRuntimeHours)) {\n            batteryUsage();\n            return 1;\n        }\n        if (request.P_budget <= 0.0F || request.P_reserve < 0.0F ||\n            request.P_reserve > request.P_budget ||\n            request.minimumStateOfChargePercent < 0.0F ||\n            request.minimumStateOfChargePercent > 100.0F ||\n            request.requiredRuntimeHours < 0.0F) {\n            std::printf("[FAIL] invalid power planning configuration\\n");\n            return 1;\n        }\n        return showResult(active_->callbacks_.configurePowerPlanning(\n            active_->callbacks_.context, request));\n    }\n\n    if (argc < 2 || !same(argv[1], "configure")''', 'console planning')
          p.write_text(s)

          p = Path('lib/MqttManager/MqttManager.cpp')
          s = p.read_text()
          old = 'if (std::strcmp(text, "CONFIGURE_POWER_LIMITS") == 0) {\n        action = ConfigCommandAction::CONFIGURE_POWER_LIMITS; return true;\n    }'
          new = 'if (std::strcmp(text, "CONFIGURE_POWER_PLANNING") == 0) {\n        action = ConfigCommandAction::CONFIGURE_POWER_PLANNING; return true;\n    }'
          if s.count(old) != 1: raise SystemExit('mqtt action')
          s = s.replace(old, new)
          s = one(s, r'    if \(request\.action == ConfigCommandAction::CONFIGURE_POWER_LIMITS\) \{.*?        request\.hasPowerLimitsConfiguration = true;\n    \}', '''    if (request.action == ConfigCommandAction::CONFIGURE_POWER_PLANNING) {\n        const cJSON* planning = cJSON_GetObjectItemCaseSensitive(root, "powerPlanning");\n        if (!cJSON_IsObject(planning) ||\n            !readFloat(cJSON_GetObjectItemCaseSensitive(planning, "P_budget"), request.P_budget) ||\n            !readFloat(cJSON_GetObjectItemCaseSensitive(planning, "P_reserve"), request.P_reserve) ||\n            !readFloat(cJSON_GetObjectItemCaseSensitive(planning, "minimumStateOfChargePercent"), request.minimumStateOfChargePercent) ||\n            !readFloat(cJSON_GetObjectItemCaseSensitive(planning, "requiredRuntimeHours"), request.requiredRuntimeHours) ||\n            request.P_budget <= 0.0F || request.P_reserve < 0.0F ||\n            request.P_reserve > request.P_budget ||\n            request.minimumStateOfChargePercent < 0.0F ||\n            request.minimumStateOfChargePercent > 100.0F ||\n            request.requiredRuntimeHours < 0.0F) {\n            cJSON_Delete(root);\n            publishAcknowledgement(request.commandId, commandType, AckStatus::REJECTED, "invalid powerPlanning", target);\n            return;\n        }\n        request.hasPowerPlanningConfiguration = true;\n    }''', 'mqtt planning')
          p.write_text(s)

          Path('.github/workflows/patch-console-mqtt.yml').unlink()
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Update console and MQTT power planning interface"
          git push origin clean-power-budget
