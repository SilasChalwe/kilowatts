        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/BatteryManager/PowerManager.h \
                  lib/BatteryManager/PowerManager.cpp \
                  lib/CentralConsole/CentralConsole.cpp \
                  lib/MqttManager/MqttManager.cpp \
                  src/central/namespace.h
          if git diff --cached --quiet; then
            echo "No migration changes required"
            exit 0
