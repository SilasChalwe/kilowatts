[platformio]
default_envs = central


[env]
platform = espressif32
framework = espidf
monitor_speed = 115200

; PlatformIO's Library Dependency Finder only exposes each top-level
; lib/<Name>/ folder as an include root, not its nested subfolders - so a
; domain library that is further split into Central/Smart role subfolders
; (e.g. lib/NodeManager/Central) needs those subfolders added explicitly,
; or a bare #include "X.h" from a file outside that subfolder (including
; from a completely different library) cannot find it. Keep this list in
; sync with lib/*/Central and lib/*/Smart whenever one is added/removed.
build_flags =
    -Ilib/NodeManager/Central
    -Ilib/NodeManager/Smart
    -Ilib/LoadManager/Central
    -Ilib/RelayManager/Central


; ============================================================================
; CENTRAL NODE
; ============================================================================
;
; Physical hardware confirmed with esptool:
;
;   MCU:   ESP32-D0WDQ6 revision 1.0
;   Flash: 4 MB
;   MAC:   A4:CF:12:0E:32:C0
;
[env:central]
board = esp32dev
lib_ignore =
    SmartApplication
board_build.cmake_extra_args =
    -DKILOWATTS_ROLE=central

; "direct" passes the serial stream straight through instead of PlatformIO's
; own terminal wrapper, which was mishandling the console's ANSI escape
; sequences (clear, line editing) and its capability-probe handshake.
monitor_filters = direct, esp32_exception_decoder
; Send one LF when Enter is pressed. ESP-IDF accepts LF, while PlatformIO's
; CR mode also rewrites received carriage returns and breaks same-line editing.
monitor_eol = LF

build_flags =
    ${env.build_flags}
    -DDEVICE_ROLE_CENTRAL

board_upload.flash_size = 4MB
board_build.partitions = partitions.csv

upload_port = /dev/ttyUSB0
monitor_port = /dev/ttyUSB0


; ============================================================================
; SMART NODE
; ============================================================================
;
; Physical hardware confirmed with esptool:
;
;   MCU:   ESP32-S3 revision 0.2
;   Flash: 16 MB
;   PSRAM: 8 MB
;   MAC:   1C:DB:D4:78:E7:B8
;
; The Smart Node is an ESP32-S3 camera board connected through an
; ESP32-CAM-MB USB/programmer base.
;
; The esp32-s3-devkitc-1 PlatformIO profile is used to select the correct
; ESP32-S3 MCU family. The physical flash detected by esptool is 16 MB.
;
; monitor_dtr and monitor_rts are disabled so opening the serial monitor
; does not manipulate the CAM-MB reset/boot control lines.
;
[env:smart]
board = esp32-s3-devkitc-1
lib_ignore =
    BatteryManager
    CentralApplication
    CentralConsole
    MqttManager
    WiFiManager
board_build.cmake_extra_args =
    -DKILOWATTS_ROLE=smart

build_flags =
    ${env.build_flags}
    -DDEVICE_ROLE_SMART

board_upload.flash_size = 16MB

upload_port = /dev/ttyUSB0
monitor_port = /dev/ttyUSB0
upload_speed = 115200

upload_flags =
    --before
    no_reset
    --after
    hard_reset

monitor_dtr = 0
monitor_rts = 0


; ============================================================================
; SMART NODE ON ESP32
; ============================================================================
;
; Uses the same Smart Node application on the 4 MB ESP32-D0WDQ6 hardware.
; This target allows one ESP32 board to be reflashed between Central and Smart
; roles for individual role testing. A simultaneous ESP-NOW integration test
; still requires two powered boards.
;
[env:smart_esp32]
board = esp32dev
lib_ignore =
    BatteryManager
    CentralApplication
    CentralConsole
    MqttManager
    WiFiManager
board_build.cmake_extra_args =
    -DKILOWATTS_ROLE=smart

build_flags =
    ${env.build_flags}
    -DDEVICE_ROLE_SMART

board_upload.flash_size = 4MB

upload_port = /dev/ttyUSB0
monitor_port = /dev/ttyUSB0

monitor_filters = direct, esp32_exception_decoder
monitor_eol = LF
