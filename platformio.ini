[platformio]
default_envs = central


[env]
platform = espressif32
framework = espidf
monitor_speed = 115200

; PlatformIO's Library Dependency Finder only exposes each top-level
; lib/<Name>/ folder as an include root, not its nested subfolders - so a
; domain library that is further split into Central/Smart role subfolders
; (e.g. lib/NodeManager/Central) needs those subfolders added explicitly,
; or a bare #include "X.h" from a file outside that subfolder (including
; from a completely different library) cannot find it. Keep this list in
; sync with lib/*/Central and lib/*/Smart whenever one is added/removed.
build_flags =
    -Ilib/NodeManager/Central
    -Ilib/NodeManager/Smart
    -Ilib/LoadManager/Central
    -Ilib/RelayManager/Central


; ============================================================================
; CENTRAL NODE
; ============================================================================
;
; Physical hardware confirmed with esptool:
;
;   MCU:   ESP32-D0WDQ6 revision 1.0
;   Flash: 4 MB
;   MAC:   A4:CF:12:0E:32:C0
;
[env:central]
board = esp32dev

build_flags =
    ${env.build_flags}
    -DDEVICE_ROLE_CENTRAL

board_upload.flash_size = 4MB
board_build.partitions = partitions.csv

upload_port = /dev/ttyUSB1
monitor_port = /dev/ttyUSB1


; ============================================================================
; SMART NODE
; ============================================================================
;
; Physical hardware confirmed with esptool:
;
;   MCU:   ESP32-S3 revision 0.2
;   Flash: 16 MB
;   PSRAM: 8 MB
;   MAC:   1C:DB:D4:78:E7:B8
;
; The Smart Node is an ESP32-S3 camera board connected through an
; ESP32-CAM-MB USB/programmer base.
;
; The esp32-s3-devkitc-1 PlatformIO profile is used to select the correct
; ESP32-S3 MCU family. The physical flash detected by esptool is 16 MB.
;
; monitor_dtr and monitor_rts are disabled so opening the serial monitor
; does not manipulate the CAM-MB reset/boot control lines.
;
[env:smart]
board = esp32-s3-devkitc-1

build_flags =
    ${env.build_flags}
    -DDEVICE_ROLE_SMART

board_upload.flash_size = 16MB

upload_port = /dev/ttyUSB0
monitor_port = /dev/ttyUSB0


monitor_dtr = 0
monitor_rts = 0